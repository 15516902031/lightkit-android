name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build libraries
        run: ./gradlew :retrofit-kernel:assembleRelease :compose-ui-kit:assembleRelease
      - name: Unit tests
        run: ./gradlew :compose-ui-kit:testDebugUnitTest
